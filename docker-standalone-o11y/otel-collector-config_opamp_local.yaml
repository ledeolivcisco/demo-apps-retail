# Splunk OTel Collector — OTLP gateway for docker-standalone-o11y.
# Based on signalfx/splunk-otel-collector v0.156.0 otlp_config_linux.yaml (traces only).
# ${SPLUNK_REALM}, ${SPLUNK_ACCESS_TOKEN}, ${SPLUNK_MEMORY_LIMIT_MIB} resolve from container env.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}
  batch:
    metadata_keys:
      - X-SF-Token

exporters:
  otlp_http:
    traces_endpoint: "https://ingest.${SPLUNK_REALM}.observability.splunkcloud.com/v2/trace/otlp"
    compression: gzip
    headers:
      "X-SF-Token": "${SPLUNK_ACCESS_TOKEN}"

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  http_forwarder/opamp_splunk_o11y:
    ingress:
      endpoint: 0.0.0.0:4320
    egress:
      endpoint: "http://host.docker.internal:4320/v1/opamp"
  opamp/splunk_o11y:
    agent_description:
      include_resource_attributes: true
    server:
      http:
        endpoint: "http://host.docker.internal:4320/v1/opamp"
        polling_interval: 30s


service:
  extensions: [health_check, http_forwarder/opamp_splunk_o11y, opamp/splunk_o11y]
  telemetry:
    resource:
      attributes:
        - name: otelcol.service.mode
          value: gateway
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
